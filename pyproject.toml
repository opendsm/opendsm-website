[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opendsm-website"
version = "0.1.0"
description = "Documentation website for OpenDSM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "opendsm", email = "opendsm@lists.lfenergy.org" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "griffe==1.14.0",
  "markdown==3.10.2",
  "mike==2.1.3",
  "mkdocs==1.6.1",
  "mkdocs-autorefs==1.4.3",
  "mkdocs-awesome-nav==3.2.0",
  "mkdocs-get-deps==0.2.0",
  "mkdocs-git-revision-date-localized-plugin==1.4.7",
  "mkdocs-material[imaging]==9.6.20",
  "mkdocs-material-extensions==1.3.1",
  "mkdocs-section-index==0.3.10",
  "mkdocs-site-urls==0.3.1",
  "mkdocstrings==0.30.0",
  "mkdocstrings-python==1.18.2",
  "pygments==2.20.0",
  "pymdown-extensions==10.21.3",
  "opendsm @ git+https://github.com/opendsm/opendsm@db86479d93b15879511eb785396fd8ef6496b4a2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.urls]
Homepage = "https://lfenergy.org/projects/opendsm"
Documentation = "https://opendsm.energy"
Repository = "https://github.com/opendsm/opendsm-website"
Issues = "https://github.com/opendsm/opendsm-website/issues"
