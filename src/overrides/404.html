{% extends "main.html" %}

{% block content %}
<div class="md-content__inner md-typeset" style="text-align: center; padding-top: 3rem; padding-bottom: 4rem;">
  <img src="{{ 'assets/images/common/opendsm-icon-color.svg' | url }}" alt="OpenDSM" width="72" style="margin-bottom: 1rem;">
  <h1 style="margin-bottom: 0.5rem;">Page not found</h1>
  <p>We couldn't find the page you were looking for. It may have moved, or the link may be out of date.</p>
  <p style="margin-top: 2rem;">
    <a class="md-button md-button--primary" href="{{ nav.homepage.url | url }}">Go to homepage</a>
    <a class="md-button" href="{{ 'documentation/' | url }}">Browse documentation</a>
  </p>
</div>
{% endblock %}
